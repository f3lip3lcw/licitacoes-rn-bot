name: Monitor DOE-RN

on:
  schedule:
    # 11:07 UTC = 08:07 em America/Sao_Paulo (UTC-3), de segunda a sexta.
    # O minuto fora do :00 não é erro: o início de cada hora é o pico do
    # Actions e agendar nele costuma atrasar a execução por horas.
    - cron: "7 11 * * 1-5"
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela de busca em dias (2 = hoje + ontem)"
        required: false
        default: "2"
      config:
        description: "Perfil: ambos, config.yaml (SEAD geral) ou config-ti.yaml (TI)"
        required: false
        default: "ambos"

permissions:
  contents: write

concurrency:
  group: doe-rn-monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # No agendamento (schedule) os inputs vêm vazios, então as condições
      # abaixo deixam os dois perfis rodarem.
      - name: Rodar o bot (SEAD geral)
        if: github.event.inputs.config != 'config-ti.yaml'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          DIAS: ${{ github.event.inputs.dias || '2' }}
        run: python bot.py --dias "$DIAS" --config config.yaml

      - name: Rodar o bot (perfil TI)
        if: always() && github.event.inputs.config != 'config.yaml'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          DIAS: ${{ github.event.inputs.dias || '2' }}
        run: python bot.py --dias "$DIAS" --config config-ti.yaml

      # Sempre envia, mesmo que um dos passos acima tenha falhado: o relatório
      # é a prova diária de que o serviço rodou, com novidade ou não.
      - name: Relatório no Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: python bot.py --relatorio

      - name: Persistir estado (evita notificações repetidas)
        if: always()
        run: |
          if git diff --quiet -- .state/seen.json; then
            echo "Sem mudanças no estado."
            exit 0
          fi

          git config user.name "doe-rn-bot"
          git config user.email "doe-rn-bot@users.noreply.github.com"
          git add .state/seen.json
          git commit -m "chore: atualiza estado do DOE-RN [skip ci]"
          git push
