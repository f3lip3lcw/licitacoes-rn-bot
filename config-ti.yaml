      - "Suporte Técnico em Informática"
      - "Manutenção de Equipamentos de Informática"
      - "Manutenção Preventiva e Corretiva de TI"
      - "Manutenção Preventiva e Corretiva de Informática"
      - "Outsourcing de Impressão"
      - "Locação de Impressora"
      - "Gestão de Impressão"
      - "Network Operations Center"
      - "Monitoramento de Rede"
      - "Terceirização de TI"
      # "NOC" ficou de fora: substring perigosa.

      # 7. Licenciamento (software de prateleira)
      - "Licenciamento de Software"
      - "Subscrição de Licenças"
      - "Renovação de Suporte Técnico"
      - "Microsoft"
      - "Office 365"
      - "Windows"
      - "Sistema de Gestão Empresarial"
      - "ERP"
      - "CRM"
