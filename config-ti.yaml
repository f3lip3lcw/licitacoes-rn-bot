      - "Switches"
      - "Roteador"
      - "Roteadores"
      - "Access Point"
      - "Rede Sem Fio"
      - "SD-WAN"
      - "Wi-Fi"

      # 4. Hardware e equipamentos (microinformática)
      - "Computador"
      - "Microcomputador"
      - "Desktop"
      - "Notebook"
      - "Laptop"
      - "Tablet"
      - "Monitor de Vídeo"
      - "Estação de Trabalho"
      - "Workstation"
      - "Nobreak"
      - "Rack"
      - "Scanner"
      - "Digitalizador"
      - "Lousa Digital"
      - "Videoconferência"
      - "Webcam"
      # "impressoras" ficou de fora: casa com serviços gráficos. Para
      # equipamento use "Locação de Impressora" (abaixo).

      # 5. Segurança da informação
