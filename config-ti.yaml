  # NOT: vale para o texto inteiro e rejeita na hora.
  termos_excluir:
    - "Rede de Esgoto"
    - "Rede de Proteção"
    - "Impressão Gráfica"
    - "Material de Limpeza"
    - "Gêneros Alimentícios"
    # "servidor publico" ficou comentado de propósito: cortaria objetos
    # legítimos de TI, como "sistema de atendimento aos servidores públicos".
    # A defesa contra concurso já vem de "concurso publico" nos negativos de
    # cabeçalho (filters.py). Se quiser testar, descomente:
    # - "Servidor Público"

  # Reaproveita do perfil geral a categoria SEAD e a exclusão de prefeituras,
  # particulares e concursos (categorias_incluir / categorias_excluir).

telegram:
  # Com as buscas de fase prévia pode vir mais publicação por dia.
  limite_notificacoes: 30
