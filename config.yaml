# Monitor de licitações do DOE-RN
#
# Diário Oficial do RN: código 121 (DEI/RN). A busca usa a API pública da
# "Busca Avançada": https://deirn.sdoe.com.br/diariooficialweb/#/busca-avancada?diario=MTIx

diario:
  codigo: 121
  nome: "DOE-RN"

periodo:
  # Janela padrão sem --data/--desde/--ate. 2 = hoje + ontem, porque a
  # publicação do DOE costuma sair durante o dia.
  dias: 2

# Cada item é uma consulta independente; os resultados são unidos e
# deduplicados pelo código da publicação.
#
# codigoCategoria 1164 = SEAD, o que inclui a Coordenadoria de Compras
# Governamentais (COMPR/SEAD). O filtro é aplicado no servidor, então a busca
# já volta só com publicações da SEAD.
#
# A API permite 100 requisições por hora: cada consulta gasta 1 (2 se paginar).
# Mantenha a lista enxuta.
buscas:
  - palavras: "licitação"
    codigoCategoria: 1164
  - palavras: "pregão eletrônico"
    codigoCategoria: 1164
  - palavras: "registro de preços"
    codigoCategoria: 1164
  - palavras: "dispensa"
    codigoCategoria: 1164
  - palavras: "credenciamento"
    codigoCategoria: 1164
  - palavras: "chamamento público"
    codigoCategoria: 1164
  - palavras: "coordenadoria de compras"
    codigoCategoria: 1164
  - palavras: "concorrência"
    codigoCategoria: 1164

filtros:
  # Segunda barreira contra outro órgão. Para monitorar todas as secretarias,
  # apague esta linha (e os codigoCategoria acima).
  categorias_incluir:
    - "Secretaria de Estado da Administração - SEAD"

  # O bot foca no Estado. Para incluir prefeituras/câmaras, use
  # --incluir-municipios ou remova as linhas correspondentes.
  categorias_excluir:
    - "Prefeituras e Câmaras Municipais"
    - "Publicações Particulares"
    - "Concurso e Processo Seletivos"
    - "Concursos e Seleções"

  # Filtro opcional por assunto, por exemplo:
  # termos_incluir: ["software", "tecnologia da informacao"]
  # termos_excluir: ["merenda escolar"]
  termos_incluir: []
  termos_excluir: []

telegram:
  # true = envia o PDF como documento quando a publicação tiver arquivo.
  anexar_pdf: false
  # true = notificação sem som
  silencioso: false
  # Teto de mensagens por execução, para não floodar o chat
  limite_notificacoes: 20

links:
  # Link direto da publicação custa 2 chamadas extras por item; por isso vem
  # desligado. Com direto: false o bot manda o link da busca, que já funciona.
  direto: false
  max_diretos: 5

estado:
  arquivo: ".state/seen.json"
  retencao_dias: 60
